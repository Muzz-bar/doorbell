services:
  doorbell-api:
    image: node:20-alpine
    container_name: doorbell-api
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      API_KEY: ${API_KEY}
      PORT: 3000
    command: sh -c "npm install express && node main.js"
    ports:
      - "3010:3000"
    restart: unless-stopped